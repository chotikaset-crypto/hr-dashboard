<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
    <div class="p-6 max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white"><i class="fa-solid text-indigo-500 mr-2 fa-users-gear"></i>HR Management Dashboard</h1>
                <p class="text-slate-400 text-sm">ระบบจัดการและวิเคราะห์ข้อมูลบุคลากร</p>
            </div>
            <div>
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span> Flask Active
                </span>
            </div>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4">
                <p class="text-slate-400 text-sm">พนักงานทั้งหมด</p>
                <h3 id="stat-total" class="text-2xl font-bold mt-1 text-indigo-400">0 คน</h3>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4">
                <p class="text-slate-400 text-sm">สถานะ Active</p>
                <h3 id="stat-active" class="text-2xl font-bold mt-1 text-emerald-400">0 คน</h3>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4">
                <p class="text-slate-400 text-sm">เงินเดือนเฉลี่ย</p>
                <h3 id="stat-avg-salary" class="text-2xl font-bold mt-1 text-amber-400">฿0</h3>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4">
                <p class="text-slate-400 text-sm">Performance เฉลี่ย</p>
                <h3 id="stat-avg-perf" class="text-2xl font-bold mt-1 text-purple-400">0.0 / 5.0</h3>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-5 backdrop-blur-sm">
            
            <!-- Controls: Search & Category Filters -->
            <div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center">
                <!-- ช่องพิมพ์ค้นหา -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="ค้นหาชื่อ, รหัส, ตำแหน่ง..." 
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
                </div>

                <!-- ตัวเลือกกรองแผนกและสถานะ -->
                <div class="flex flex-wrap gap-3 w-full md:w-auto">
                    <!-- กรองแผนก -->
                    <select id="dept-filter" class="bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
                        <option value="ALL">ทุกแผนก (All Depts)</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                    </select>

                    <!-- กรองสถานะ -->
                    <select id="status-filter" class="bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
                        <option value="ALL">ทุกสถานะ (All Status)</option>
                        <option value="Active">Active</option>
                        <option value="On Leave">On Leave</option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="text-xs uppercase bg-slate-800 text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="py-3 px-4">รหัส</th>
                            <th class="py-3 px-4">ชื่อ-นามสกุล</th>
                            <th class="py-3 px-4">ตำแหน่ง</th>
                            <th class="py-3 px-4">แผนก</th>
                            <th class="py-3 px-4">สถานะ</th>
                            <th class="py-3 px-4 text-right">เงินเดือน</th>
                            <th class="py-3 px-4 text-center">Performance</th>
                        </tr>
                    </thead>
                    <tbody id="emp-table-body" class="divide-y divide-slate-800"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allEmployees = [];

        async function fetchEmployees() {
            try {
                const response = await fetch('/api/employees');
                allEmployees = await response.json();
                applyFilters();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function applyFilters() {
            const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedDept = document.getElementById('dept-filter').value;
            const selectedStatus = document.getElementById('status-filter').value;

            const filteredData = allEmployees.filter(emp => {
                const matchesSearch = 
                    emp.name.toLowerCase().includes(searchKeyword) ||
                    emp.id.toLowerCase().includes(searchKeyword) ||
                    emp.position.toLowerCase().includes(searchKeyword);

                const matchesDept = (selectedDept === 'ALL') || (emp.department === selectedDept);
                const matchesStatus = (selectedStatus === 'ALL') || (emp.status === selectedStatus);

                return matchesSearch && matchesDept && matchesStatus;
            });

            renderTable(filteredData);
            updateStats(filteredData);
        }

        function renderTable(employees) {
            const tbody = document.getElementById('emp-table-body');
            tbody.innerHTML = '';

            if (employees.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-500">ไม่พบข้อมูลที่ค้นหา</td></tr>`;
                return;
            }

            employees.forEach(emp => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-800/50 transition-colors';
                row.innerHTML = `
                    <td class="py-3 px-4 font-mono text-xs text-indigo-400">${emp.id}</td>
                    <td class="py-3 px-4 font-medium text-white">${emp.name}</td>
                    <td class="py-3 px-4">${emp.position}</td>
                    <td class="py-3 px-4"><span class="px-2 py-0.5 text-xs bg-slate-700 rounded text-slate-300">${emp.department}</span></td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-0.5 text-xs rounded-full ${emp.status === 'Active' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'}">
                            ${emp.status}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-right font-mono">฿${emp.salary.toLocaleString()}</td>
                    <td class="py-3 px-4 text-center font-bold text-indigo-400">${emp.performance}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateStats(employees) {
            const total = employees.length;
            const activeCount = employees.filter(e => e.status === 'Active').length;
            
            const totalSalary = employees.reduce((sum, e) => sum + e.salary, 0);
            const avgSalary = total > 0 ? Math.round(totalSalary / total) : 0;

            const totalPerf = employees.reduce((sum, e) => sum + e.performance, 0);
            const avgPerf = total > 0 ? (totalPerf / total).toFixed(2) : '0.00';

            document.getElementById('stat-total').textContent = `${total} คน`;
            document.getElementById('stat-active').textContent = `${activeCount} คน`;
            document.getElementById('stat-avg-salary').textContent = `฿${avgSalary.toLocaleString()}`;
            document.getElementById('stat-avg-perf').textContent = `${avgPerf} / 5.0`;
        }

        // Event Listeners
        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('dept-filter').addEventListener('change', applyFilters);
        document.getElementById('status-filter').addEventListener('change', applyFilters);

        document.addEventListener('DOMContentLoaded', fetchEmployees);
    </script>
</body>
</html>
